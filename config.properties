
# =====================================================================
# ElevanceAmazonAutomation configuration
# =====================================================================

# Passwords and SMTP secrets are NEVER stored here.
# Use environment variables:
# AMAZON_EMAIL, AMAZON_PASSWORD, SMTP_HOST, SMTP_PORT,
# SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM, SMTP_TO.


# ---------------- General / browser ----------------

amazon.baseUrl=https://www.amazon.in

explicitWait.seconds=20

browser.headless=false

browser.manualInterventionSeconds=120


# ---------------- Task 1: product selection (15:00-18:00 IST) ----------------

task1.searchKeyword=steel water bottle

task1.maxResultsToScan=30

task1.maxProductsToOpen=10


# ---------------- Task 2: search + filters (15:00-18:00 IST) ----------------

task2.searchKeyword=running shoes

task2.brandInitial=C

# Strict comparisons: price > 2000 and rating > 4.0

task2.minPriceExclusive=2000

task2.minRatingExclusive=4.0

# Search-result cards to scan

task2.maxResultsToScan=80

# Maximum product pages to open and independently verify

task2.maxProductsToOpen=40


# ---------------- Task 3: cart / payment / order confirmation (18:00-19:00 IST) ----------------

task3.searchKeyword=backpack

task3.minAmountExclusive=500

task3.maxProductsToTry=5


# ---------------- Task 4: login + profile name (12:00-15:00 IST) ----------------

# Profile name must NOT contain these letters (case-insensitive)

task4.forbiddenLetters=ACGILK


# ---------------- Task 5: multi-product cart + username (18:00-19:00 IST) ----------------

task5.searchKeywords=running shoes,backpack,wrist watch

task5.minItemPrice=800

task5.minProducts=2

task5.minTotalExclusive=2000

# Test username: exactly 10 letters/digits

task5.username=Intern2026


# ---------------- Task 6: price monitor (no time window) ----------------

# Replace placeholder with a real Amazon product URL

task6.productUrl=https://www.amazon.in/dp/B0H4Z69BSF
task6.priceThreshold=1000
task6.pollIntervalSeconds=900
monitor.minIntervalSeconds=60
task6.stopFile=stop-monitor.flag
task6.headless=true
